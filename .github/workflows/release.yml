name: Private Veröffentlichung
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-test.txt
      - run: npx --no-install playwright install --with-deps --only-shell chromium firefox webkit
      - run: python scripts/manifest.py --check
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm test
      # Tests aktualisieren Nachweise. Das Release enthält die geprüften Commit-Bytes.
      - run: git restore -- Lernwerkzeug/pruefung
      - run: python scripts/release.py "$RELEASE_TAG"
      - run: gh release create "$RELEASE_TAG" ".upload-work/releases/$RELEASE_TAG/CuD-1-$RELEASE_TAG.zip" ".upload-work/releases/$RELEASE_TAG/SHA256SUMS" --verify-tag --title "CuD-1 $RELEASE_TAG" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
