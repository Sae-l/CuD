name: Projektprüfung
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Prüfen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-test.txt
      - run: npx --no-install playwright install --with-deps --only-shell chromium firefox webkit
      - run: python scripts/manifest.py --check
      - run: python Obsidian-CuD/Pruefung/vault_pruefen.py
      - run: node Obsidian-CuD/Pruefung/beispiel_pruefen.cjs
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pruefnachweise-${{ matrix.os }}
          path: Lernwerkzeug/pruefung/
          retention-days: 14
